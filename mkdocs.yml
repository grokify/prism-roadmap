site_name: PRISM Roadmap
site_description: Go library for structured planning documents (PRD, MRD, TRD) with goals alignment
site_url: https://grokify.github.io/prism-roadmap/
repo_url: https://github.com/grokify/prism-roadmap
repo_name: grokify/prism-roadmap
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/prism-roadmap

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Document Types:
      - Overview: documents/overview.md
      - PRD (Product Requirements): documents/prd.md
      - MRD (Market Requirements): documents/mrd.md
      - TRD (Technical Requirements): documents/trd.md
  - Goals Alignment:
      - Overview: goals/overview.md
      - V2MOM Integration: goals/v2mom.md
      - OKR Integration: goals/okr.md
  - Views & Output:
      - PM View: views/pm-view.md
      - Executive View: views/exec-view.md
      - 6-Pager: views/six-pager.md
      - PR/FAQ: views/prfaq.md
      - Marp Slides: views/slides.md
  - Strategic Canvases:
      - Overview: canvas/overview.md
      - Business Model Canvas: canvas/bmc.md
      - Opportunity Solution Tree: canvas/ost.md
      - Opportunity Canvas: canvas/opportunity.md
      - Opportunity Assessment: canvas/opportunity-assessment.md
      - OpportunitySpec: canvas/opportunity-spec.md
      - Feature Canvas: canvas/feature.md
      - Lean UX Canvas: canvas/leanux.md
      - Prioritization (RICE & Kano): canvas/prioritization.md
  - Features:
      - Scoring & Validation: features/scoring.md
      - Market Signal: features/market-signal.md
      - Effort Estimation: features/effort-estimation.md
      - Roadmap Items (RMI): features/roadmap-items.md
      - Persona Library: features/persona-library.md
      - Completeness Check: features/completeness.md
  - Examples:
      - PRD Examples: examples/prd-examples.md
      - Integration Examples: examples/integration.md
  - Workflows:
      - Merging Modular Files: merge.md
  - API Reference: api/reference.md
  - Specifications:
      - Cascading Goals:
          - PRD: specs/cascading-goals/PRD.md
          - TRD: specs/cascading-goals/TRD.md
          - Roadmap: specs/cascading-goals/ROADMAP.md
  - Releases:
      - v0.16.0: releases/v0.16.0.md
      - v0.15.0: releases/v0.15.0.md
      - v0.14.0: releases/v0.14.0.md
      - v0.13.0: releases/v0.13.0.md
      - v0.12.0: releases/v0.12.0.md
      - v0.11.0: releases/v0.11.0.md
      - v0.10.0: releases/v0.10.0.md
      - v0.9.0: releases/v0.9.0.md
      - v0.8.0: releases/v0.8.0.md
      - v0.7.0: releases/v0.7.0.md
      - v0.6.0: releases/v0.6.0.md
      - v0.5.0: releases/v0.5.0.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md
